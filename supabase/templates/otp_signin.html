<!--
  Forecast Cockpit — OTP sign-in email (Terra brand)
  Subject:  {{ .Token }} is your Forecast Cockpit sign-in code
  Notes:    Table layout + inline CSS, no images or remote fonts (lightweight + spam-resistant).
            Pair with the plain-text version (otp_signin.txt) as the multipart alternative.
-->
<!DOCTYPE html>
<html lang="en-GB" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <title>Your sign-in code</title>
</head>
<body style="margin:0; padding:0; width:100%; background-color:#F4F3F0;">

  <!-- Preheader: shown in the inbox preview, hidden in the body -->
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:#F4F3F0;">
    Your one-time sign-in code is inside.
    &#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F4F3F0;">
    <tr>
      <td align="center" style="padding:40px 16px;">

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px; margin:0 auto;">

          <!-- Card -->
          <tr>
            <td style="background-color:#FEFDFB; border:1px solid #EDEBE8; border-radius:14px; padding:36px 32px;">

              <h1 style="margin:0 0 14px 0; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:21px; line-height:1.3; font-weight:700; letter-spacing:-0.3px; color:#1B1A18;">
                Your sign-in code
              </h1>

              <p style="margin:0 0 24px 0; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:15px; line-height:1.6; color:#7B7974;">
                Please give care to the fact this code should never be shared with others. Pop the code displayed below into the app to complete your authorisation.
              </p>

              <!-- Code block -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="background-color:#FFF3ED; border:1px solid #FFD9C2; border-radius:10px; padding:22px 16px;">
                    <div style="font-family:'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace; font-size:34px; font-weight:700; letter-spacing:8px; color:#B53D0A;">
                      {{ .Token }}
                    </div>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
